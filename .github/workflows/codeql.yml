name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main", "feature/mvnpkg_upgrade"]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight

jobs:
  analyze:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Setup Java Environment (Match your Spring Boot version, e.g., 17 or 21)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 2. Initialize the CodeQL Tools
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java-kotlin
        # Optional: Switch to 'security-extended' for deeper vulnerability tracking
        queries: security-extended 

    # 3. Explicitly compile the Spring Boot app so CodeQL maps the bytecode
    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    # 4. Execute SAST scan and publish results to GitHub Security tab
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
