name: "CodeQL Security Scan (Private Repo)"

on:
  push:
    branches: [ "main", "feature/mvnpkg_upgrade"]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java-kotlin
        queries: security-extended

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        upload: false # Stops the private repo error by disabling GitHub tab upload
        output: ${{ runner.workspace }}/results

    - name: Upload Scan Results as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-security-report
        path: ${{ runner.workspace }}/results/*.sarif
