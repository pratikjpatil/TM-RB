# spring.kafka.ssl.trust-store-password=${KAFKA_TRUSTSTORE_PASSWORD}


# ========================================
# Async Configuration
# ========================================
# FIXED: Added async executor configuration for HDFS writes
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=report-async-

# ========================================
# Circuit Breaker (Resilience4j)
# ========================================
# FIXED: Added circuit breaker for HDFS operations
resilience4j.circuitbreaker.instances.hdfs.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.hdfs.slidingWindowSize=10
resilience4j.circuitbreaker.instances.hdfs.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.hdfs.failureRateThreshold=50
resilience4j.circuitbreaker.instances.hdfs.waitDurationInOpenState=30000
resilience4j.circuitbreaker.instances.hdfs.permittedNumberOfCallsInHalfOpenState=3

# Circuit Breaker for Database
resilience4j.circuitbreaker.instances.database.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.database.slidingWindowSize=20
resilience4j.circuitbreaker.instances.database.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.database.failureRateThreshold=60
resilience4j.circuitbreaker.instances.database.waitDurationInOpenState=60000

# ========================================
# Retry Configuration
# ========================================
# FIXED: Added retry configuration for transient failures
resilience4j.retry.instances.hdfs.maxAttempts=3
resilience4j.retry.instances.hdfs.waitDuration=1000
resilience4j.retry.instances.hdfs.enableExponentialBackoff=true
resilience4j.retry.instances.hdfs.exponentialBackoffMultiplier=2

resilience4j.retry.instances.database.maxAttempts=2
resilience4j.retry.instances.database.waitDuration=500


# ========================================
# Actuator & Health Checks
# ========================================
#  FIXED: Added actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Custom health indicators
management.health.diskspace.enabled=true
management.health.db.enabled=true


# ========================================
# HTTP Configuration
# ========================================
# Request timeout
server.connection-timeout=120000

# Max upload size for templates
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB



# ========================================
# Batch Processing Configuration
# ========================================

# Filter Validation
report.batch.filter.max-in-values=10000
report.batch.filter.max-conditions=50

# Query Execution
report.batch.query.timeout-seconds=300
report.batch.query.retry-attempts=2

# Materialization
report.batch.materialization.timeout-minutes=240
report.batch.materialization.parallel-threads=15
report.batch.materialization.failure-threshold=0.2

# Materialization result storage (memory|redis)
report.batch.result-store=redis
# Batch status storage (memory|redis)
report.batch.status-store=redis
# Applies only when result-store=memory
report.batch.materialization.max-inmemory-estimated-rows=2000000

# Result Distribution
report.batch.distribution.cache.max-entries-per-job=1000
# Deprecated (kept for backward compatibility): report.batch.distribution.cache-size
report.batch.distribution.bulk-key-limit=10000

# Safety Limits
report.batch.max-specs-per-template=10000
report.batch.max-reports-per-job=50000

report.batch.use-redis-cache=true

#report.logo.path=E:/F1-Test/sbi-logo.png
report.logo.path=classpath:images/sbi-logo.png

# ========================================
# Logging Configuration
# ========================================
# Production: INFO level
logging.level.root=INFO
logging.level.com.tcs.fincore.ReportBuilder=INFO
#logging.level.org.springframework.jdbc.core=TRACE
# Log pattern with request tracking
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

