spring.application.name=ReportBuilder
spring.profiles.active=dev
server.port=8091
server.tomcat.connection-timeout=120000

# Database pool
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=840000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# Cache / Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=reportbuilder:
spring.cache.redis.enable-statistics=true
spring.data.redis.host=10.0.19.238
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=48
spring.data.redis.lettuce.pool.max-idle=24
spring.data.redis.lettuce.pool.min-idle=8

# HDFS
hadoop.fs.uri=hdfs://10.177.103.199:8022
hadoop.fs.user=root
report.batch.hdfs-base-path=/reports

# Kafka
#spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.bootstrap-servers=kafka-0.kafka.be-test.svc.cluster.local:9092
kafka.consumer.group-id=report-builder-group
kafka.consumer.concurrency=3
kafka.consumer.max-poll-records=5
kafka.consumer.poll-timeout-ms=3000
kafka.retry.initial-interval-ms=1000
kafka.retry.multiplier=2.0
kafka.retry.max-interval-ms=30000
kafka.retry.max-attempts=3
kafka.topics.report-trigger=report-builder.batch-mode.trigger
kafka.topics.report-started=report-builder.batch-mode.started
kafka.topics.report-completed=report-builder.batch-mode.completed
kafka.topics.single-report-trigger=report-builder.single-mode.trigger
kafka.topics.single-report-started=report-builder.single-mode.started
kafka.topics.single-report-completed=report-builder.single-mode.completed

# Async executor
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=report-async-

# Monitoring
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Batch processing
report.aggregation.global-timeout-ms=1800000
report.aggregation.max-concurrent-queries=50
report.batch.filter.max-in-values=10000
report.batch.filter.max-conditions=50
report.batch.materialization.timeout-minutes=240
report.batch.materialization.parallel-threads=15
report.batch.materialization.max-inmemory-estimated-rows=2000000
report.batch.result-store=redis
report.batch.status-store=redis
report.batch.distribution.cache.max-entries-per-job=1000
report.batch.max-specs-per-template=10000
report.batch.max-reports-per-job=50000

report.logo.path=classpath:images/sbi-logo.png

logging.level.root=INFO
logging.level.com.tcs.fincore.ReportBuilder=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

