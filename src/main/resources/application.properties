# ========================================
# Application Configuration
# ========================================
spring.application.name=ReportBuilder
server.port=8091
spring.profiles.active=dev

# ========================================
# Report Processing Configuration
# ========================================
# Aggregation timeout - 30 minutes
report.aggregation.global-timeout-ms=1800000

#  FIXED: Added max concurrent queries limit to prevent unbounded execution
report.aggregation.max-concurrent-queries=50

# ========================================
# Database Connection Pool (HikariCP)
# ========================================
# FIXED: Reduced minimum-idle to save resources
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=60000

# Health check and connection validation
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

# Oracle Performance Optimizations
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# ========================================
# Caching Configuration (Redis)
# ========================================
#  FIXED: Proper Redis cache configuration
spring.cache.type=redis


# --- Redis Configuration ---
spring.data.redis.host=10.0.19.238
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms

#--- hdfs config --------
hadoop.fs.uri=hdfs://10.177.103.199:8022
hadoop.fs.user=root
report.batch.hdfs-base-path=/reports


# Redis cache specific settings
spring.data.redis.lettuce.pool.max-active=48
spring.data.redis.lettuce.pool.max-idle=24
spring.data.redis.lettuce.pool.min-idle=8

# Cache configuration
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=reportbuilder:

# Enable cache statistics
spring.cache.redis.enable-statistics=true


# ========================================
# Kafka Configuration ? Full section (replaces existing kafka block in application.properties)
# ========================================

# -- Kafka Broker ------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
# For production with multiple brokers:
# spring.kafka.bootstrap-servers=broker1:9092,broker2:9092,broker3:9092


# -- Topics ------------------------------------------------

# === BATCH MODE (multi-report jobs via BatchJobOrchestrator) ===
# Incoming: external systems trigger batch report generation here
kafka.topics.report-trigger=report-builder.batch-mode.trigger

# Outgoing: lifecycle events for batch jobs
kafka.topics.report-started=report-builder.batch-mode.started
kafka.topics.report-completed=report-builder.batch-mode.completed

# === SINGLE MODE (single-report jobs via generate-for-hdfs endpoint) ===
# Incoming: external systems trigger single report generation here
kafka.topics.single-report-trigger=report-builder.single-mode.trigger

# Outgoing: lifecycle events for single mode jobs
# (STARTED and COMPLETED/FAILED are both published to the 'completed' topic)
kafka.topics.single-report-started=report-builder.single-mode.started
kafka.topics.single-report-completed=report-builder.single-mode.completed


# -- Consumer (shared settings for both modes) -----------
kafka.consumer.group-id=report-builder-group
# Number of consumer threads per listener container
# Set = number of partitions on each topic for maximum parallelism
kafka.consumer.concurrency=3
# Keep low ? each batch message triggers a full job, each single message triggers a full report
kafka.consumer.max-poll-records=5
kafka.consumer.poll-timeout-ms=3000


# -- Retry / Error Handling (shared across both modes) ----
# Exponential back-off: 1s ? 2s ? 4s ? 8s ? 16s ? 30s (cap)
kafka.retry.initial-interval-ms=1000
kafka.retry.multiplier=2.0
kafka.retry.max-interval-ms=30000
# After these retries, the message is routed to the Dead Letter Topic (DLT)
kafka.retry.max-attempts=3


# -- Dead Letter Topics (DLT) -----------------------------
# Spring Kafka auto-creates:
#   report.generation.trigger.DLT  (batch mode)
#   report.single.trigger.DLT      (single mode)
# Monitor both topics and alert when messages land here.


